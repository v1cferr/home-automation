# Home Assistant Container. Discovery-first bootstrap: no add-on services yet.
# Rationale for every choice below: docs/architecture.md
name: home-automation

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    # Host networking: zeroconf (mDNS), SSDP and DHCP discovery rely on multicast and
    # broadcast on the LAN, which a bridge network does not forward.
    network_mode: host
    environment:
      TZ: America/Sao_Paulo
    volumes:
      # Runtime state (.storage, database, logs, backups, deps, custom_components) lives on
      # the host, outside this repository. Set HA_STATE_DIR in .env; see .env.example.
      - ${HA_STATE_DIR:-/var/lib/home-assistant}:/config
      # The reviewed, tracked YAML is laid read-only over the state directory. A single-file
      # mount pins the inode: after a `git checkout` that rewrites configuration.yaml, restart
      # the container (Home Assistant only reloads YAML on restart anyway).
      - ./config/configuration.yaml:/config/configuration.yaml:ro
      - ./config/packages:/config/packages:ro
    restart: unless-stopped
    # Give the recorder time to flush and close the SQLite database on `docker compose down`.
    stop_grace_period: 2m
    # Not privileged, and no D-Bus or /dev mounts: Bluetooth and USB radios are out of scope.
